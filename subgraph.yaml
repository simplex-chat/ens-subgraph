specVersion: 0.0.4
description: >-
  SNRC subgraph — indexes the SimpleX Namespace Registry deployment on Ethereum.
  Fork of ensdomains/ens-subgraph adapted to point at our ENS-shaped
  contracts (ENSRegistry / BaseRegistrarImplementation / NameWrapper /
  PublicResolver) plus our SimplexController.
repository: "https://github.com/simplex-chat/ens-subgraph"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ENSRegistry
    network: mainnet
    source:
      # SNRC mainnet .testing ENSRegistry (UUPS proxy)
      address: "0x03f438da0bd44da3c6c1d0392f8ba183b8b3a7a6"
      abi: EnsRegistry
      # ENSRegistry deploy tx 0x66959f0a… mined at block 25250877.
      # We start a few blocks earlier as a safety margin.
      startBlock: 25250870
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensRegistry.ts
      entities:
        - Domain
        - Account
        - Resolver
      abis:
        - name: EnsRegistry
          file: ./abis/Registry.json
      eventHandlers:
        - event: "Transfer(indexed bytes32,address)"
          handler: handleTransfer
        - event: "NewOwner(indexed bytes32,indexed bytes32,address)"
          handler: handleNewOwner
        - event: "NewResolver(indexed bytes32,address)"
          handler: handleNewResolver
        - event: "NewTTL(indexed bytes32,uint64)"
          handler: handleNewTTL

  - kind: ethereum/contract
    name: Resolver
    network: mainnet
    source:
      # SNRC mainnet .testing PublicResolver. Upstream ENS leaves this
      # entry without an address (and without a startBlock) and relies
      # on per-name dynamic resolver indexing — but Graph Node 0.36
      # interprets a missing startBlock as block 1, which makes the
      # whole subgraph try to scan logs from genesis. We pin to the one
      # PublicResolver our `.testing` names use; if a name ever picks a
      # custom resolver, its events won't be indexed here (template
      # promotion is a follow-up).
      address: "0x80fa1903e70af03e79c73fb7feae2fb33aebae01"
      abi: Resolver
      startBlock: 25250870
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/resolver.ts
      entities:
        - AddrChanged
        - MulticoinAddrChanged
        - NameChanged
        - AbiChanged
        - PubkeyChanged
        - Textchanged
        - ContenthashChanged
        - InterfaceChanged
        - AuthorisationChanged
      abis:
        - name: Resolver
          file: ./abis/PublicResolver.json
      eventHandlers:
        - event: "ABIChanged(indexed bytes32,indexed uint256)"
          handler: handleABIChanged
        - event: "AddrChanged(indexed bytes32,address)"
          handler: handleAddrChanged
        - event: "AddressChanged(indexed bytes32,uint256,bytes)"
          handler: handleMulticoinAddrChanged
        - event: >-
            AuthorisationChanged(indexed bytes32,indexed address,indexed
            address,bool)
          handler: handleAuthorisationChanged
        - event: "ContenthashChanged(indexed bytes32,bytes)"
          handler: handleContentHashChanged
        - event: "InterfaceChanged(indexed bytes32,indexed bytes4,address)"
          handler: handleInterfaceChanged
        - event: "NameChanged(indexed bytes32,string)"
          handler: handleNameChanged
        - event: "PubkeyChanged(indexed bytes32,bytes32,bytes32)"
          handler: handlePubkeyChanged
        - event: "TextChanged(indexed bytes32,indexed string,string)"
          handler: handleTextChanged
        - event: "TextChanged(indexed bytes32,indexed string,string,string)"
          handler: handleTextChangedWithValue
        - event: "VersionChanged(indexed bytes32,uint64)"
          handler: handleVersionChanged

  - kind: ethereum/contract
    name: BaseRegistrar
    network: mainnet
    source:
      # SNRC mainnet .testing BaseRegistrarImplementation (UUPS proxy)
      address: "0x42d63e6a9f92c0282dc0b9677d9192d491b0da72"
      abi: BaseRegistrar
      startBlock: 25250870
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - NameRegistered
        - NameRenewed
        - NameTransferred
      abis:
        - name: BaseRegistrar
          file: ./abis/BaseRegistrar.json
      eventHandlers:
        - event: "NameRegistered(indexed uint256,indexed address,uint256)"
          handler: handleNameRegistered
        - event: "NameRenewed(indexed uint256,uint256)"
          handler: handleNameRenewed
        - event: "Transfer(indexed address,indexed address,indexed uint256)"
          handler: handleNameTransferred

  - kind: ethereum/contract
    name: NameWrapper
    network: mainnet
    source:
      # SNRC mainnet .testing NameWrapper
      address: "0x9be8cf2b3d315a290de52f4c878a9e890269877f"
      abi: NameWrapper
      startBlock: 25250870
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/nameWrapper.ts
      entities:
        - NameWrapper
      abis:
        - name: NameWrapper
          file: ./abis/NameWrapper.json
      eventHandlers:
        - event: "NameWrapped(indexed bytes32,bytes,address,uint32,uint64)"
          handler: handleNameWrapped
        - event: "NameUnwrapped(indexed bytes32,address)"
          handler: handleNameUnwrapped
        - event: "FusesSet(indexed bytes32,uint32)"
          handler: handleFusesSet
        - event: "ExpiryExtended(indexed bytes32,uint64)"
          handler: handleExpiryExtended
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch

  - kind: ethereum/contract
    name: SimplexController
    network: mainnet
    source:
      # SNRC mainnet .testing SimplexController (UUPS proxy address; stable
      # across implementation upgrades, so this never needs to change unless
      # the registrar swaps to a different proxy).
      address: "0x41d7522837fe4f715f9e3aaaae99711870aaeefb"
      abi: SimplexController
      startBlock: 25250870
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/simplexController.ts
      entities:
        - Registration
      abis:
        - name: SimplexController
          file: ./abis/SimplexController.json
      eventHandlers:
        # SimplexController's NameRegistered carries an extra `bytes32 referrer`
        # field over upstream ENS's NameRegistered. We currently drop the
        # referrer when indexing — wire it through schema.graphql when the
        # frontend wants to surface referral analytics.
        - event: >-
            NameRegistered(string,indexed bytes32,indexed
            address,uint256,uint256,uint256,bytes32)
          handler: handleNameRegisteredBySimplexController
        - event: "NameRenewed(string,indexed bytes32,uint256,uint256,bytes32)"
          handler: handleNameRenewedBySimplexController
